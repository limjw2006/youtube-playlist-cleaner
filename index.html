<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>재생목록 클리너</title>
<link rel="stylesheet" href="style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="mark">재생목록 클리너</div>
      <div id="account" class="account hidden"></div>
    </header>

    <main id="view-signedout" class="view">
      <p class="lede">삭제되거나 비공개로 바뀐 영상은 재생목록에 그대로 남아 자리만 차지합니다. 구글 계정을 연결하면 어떤 영상이 문제인지 바로 찾아드립니다.</p>
      <button id="btn-connect" class="btn btn-primary">구글 계정 연결</button>
      <p id="signedout-error" class="error hidden"></p>
    </main>

    <main id="view-playlists" class="view hidden">
      <div class="row-between">
        <h2 class="section-title">재생목록 선택</h2>
        <button id="btn-refresh" class="btn btn-ghost btn-small">새로고침</button>
      </div>
      <ul id="playlist-list" class="list"></ul>
      <p id="playlists-empty" class="muted hidden">재생목록이 없습니다.</p>
    </main>

    <main id="view-scanning" class="view hidden">
      <div class="scan-status">
        <div class="spinner" aria-hidden="true"></div>
        <p id="scan-status-text">영상 확인 중…</p>
        <p id="scan-progress" class="muted"></p>
      </div>
    </main>

    <main id="view-results" class="view hidden">
      <div class="row-between">
        <h2 class="section-title"><span id="results-playlist-title"></span></h2>
        <button id="btn-back" class="btn btn-ghost btn-small">목록으로</button>
      </div>

      <p id="results-summary" class="lede"></p>

      <div id="results-clean" class="empty-state hidden">
        <p>이용 불가 영상이 없습니다.</p>
      </div>

      <ul id="results-list" class="list hidden"></ul>

      <div id="results-actions" class="actions hidden">
        <button id="btn-select-all" class="btn btn-ghost btn-small">전체 선택</button>
        <div class="actions-right">
          <button id="btn-export" class="btn btn-ghost btn-small">CSV 내보내기</button>
          <button id="btn-delete" class="btn btn-danger btn-small">선택 항목 삭제</button>
        </div>
      </div>
    </main>

    <footer id="footer-error" class="footer-error hidden"></footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
